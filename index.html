<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Confirmation Generator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#152A4E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#152A4E;
    --navy-deep:#0D1B33;
    --amber:#F0A93A;
    --amber-deep:#D98F1E;
    --slate:#5B6478;
    --line:#E3E6EE;
    --bg:#F4F5F9;
    --card:#FFFFFF;
    --ok:#2E9E5B;
    --danger:#D64545;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Inter',sans-serif;
    margin:0;
    background:var(--bg);
    color:var(--navy-deep);
    padding:28px 20px 60px;
  }
  .page-head{
    max-width:1280px;
    margin:0 auto 24px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .page-head .brand{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:-0.02em;
    color:var(--navy);
  }
  .page-head .brand span{color:var(--amber-deep);}
  .page-head .tag{
    font-size:13px;
    color:var(--slate);
    font-family:'IBM Plex Mono',monospace;
  }
  .container{
    max-width:1280px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1.15fr 1fr;
    gap:22px;
    align-items:start;
  }
  .card{
    background:var(--card);
    border-radius:14px;
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(21,42,78,0.04), 0 10px 30px -18px rgba(21,42,78,0.18);
  }
  .form-card{padding:26px 26px 30px;}
  .section-title{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--navy);
    margin:26px 0 12px;
    padding-bottom:8px;
    border-bottom:2px solid var(--line);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title:first-of-type{margin-top:0;}
  .section-title .num{
    background:var(--navy);
    color:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    width:20px;height:20px;
    border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    letter-spacing:0;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .field{margin-bottom:0;}
  .field.full{grid-column:1 / -1;}
  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--slate);
    margin-bottom:5px;
  }
  label .req{color:var(--danger);}
  input, select, textarea{
    width:100%;
    padding:10px 12px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--navy-deep);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea{resize:vertical;min-height:44px;}
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--amber-deep);
    box-shadow:0 0 0 3px rgba(240,169,58,0.18);
  }
  .conditional{
    display:none;
    background:#FFF8EC;
    border:1.5px dashed var(--amber-deep);
    border-radius:10px;
    padding:12px 14px;
    margin-top:10px;
  }
  .conditional.show{display:block;}
  .checkbox-row{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    padding:6px 2px;
  }
  .checkbox-row label{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13.5px;
    font-weight:500;
    color:var(--navy-deep);
    margin:0;
    cursor:pointer;
  }
  .checkbox-row input[type="checkbox"]{width:16px;height:16px;margin:0;accent-color:var(--amber-deep);}
  .btn-row{display:flex;gap:10px;margin-top:26px;}
  button{
    flex:1;
    padding:13px 16px;
    font-size:14.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    border-radius:9px;
    border:none;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  button:active{transform:scale(0.98);}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-secondary{background:#fff;color:var(--slate);border:1.5px solid var(--line);flex:0 0 110px;}
  .btn-secondary:hover{border-color:var(--slate);}

  /* ---- Interactive checklist ---- */
  #checklistFields{
    margin-top:14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:10px 14px 4px;
    background:#FAFAFC;
    max-height:360px;
    overflow-y:auto;
  }
  .cl-heading{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--navy);
    margin:14px 0 6px;
    padding-bottom:5px;
    border-bottom:1px solid var(--line);
  }
  .cl-heading:first-child{margin-top:4px;}
  .cl-item{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px 14px;
    padding:8px 2px;
    border-bottom:1px dashed var(--line);
  }
  .cl-item:last-child{border-bottom:none;}
  .cl-label{
    flex:1 1 240px;
    font-size:13px;
    font-weight:500;
    color:var(--navy-deep);
  }
  .cl-options{display:flex;gap:10px;flex-wrap:wrap;}
  .cl-opt{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:12.5px;
    font-weight:600;
    color:var(--slate);
    cursor:pointer;
    white-space:nowrap;
  }
  .cl-opt input{width:14px;height:14px;margin:0;accent-color:var(--amber-deep);}
  .cl-opt:has(input:checked){color:var(--navy-deep);}
  .cl-note{
    flex:0 0 130px;
    padding:6px 8px;
    font-size:12px;
    border-radius:6px;
    border:1.5px solid var(--line);
  }
  .cl-fixed-note{
    font-size:12px;
    color:var(--slate);
    background:#FFF8EC;
    border:1px dashed var(--amber-deep);
    border-radius:8px;
    padding:8px 10px;
    margin:10px 0;
    white-space:pre-wrap;
  }

  .output-card{
    padding:22px 22px 26px;
    position:sticky;
    top:20px;
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 40px);
  }
  .output-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .output-head h3{
    font-family:'Sora',sans-serif;
    font-size:15px;
    margin:0;
    color:var(--navy);
  }
  #output{
    flex:1;
    min-height:420px;
    overflow-y:auto;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:16px;
    font-family:Verdana, sans-serif;
    font-size:10pt;
    line-height:1.6;
    white-space:pre-wrap;
    background:#FCFCFD;
    color:var(--navy-deep);
  }
  #output:empty::before{
    content:"Fill in the form and hit Generate — your confirmation email will appear here.";
    color:var(--slate);
    font-family:'Inter',sans-serif;
    font-style:italic;
  }
  .copy-confirm{
    color:var(--ok);
    font-size:13px;
    font-weight:600;
    margin-top:10px;
    display:none;
  }
  .hidden-textarea{position:absolute;left:-9999px;}

  @media (max-width: 980px){
    .container{grid-template-columns:1fr;}
    .grid2{grid-template-columns:1fr;}
    .output-card{position:static;max-height:none;}
    input, select, textarea, button{font-size:16px;padding:12px;}
  }
</style>
</head>
<body>

<div class="page-head">
  <div class="brand">Training <span>Confirmation</span> Generator</div>
  <div class="tag">Created by Tapendu @2026, July</div>
</div>

<div class="container">

  <div class="card form-card">

    <div class="section-title"><span class="num">1</span>Session & Customer Details</div>
    <div class="grid2">
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label for="restId">Restaurant ID / ORG ID</label>
        <input type="number" id="restId" placeholder="e.g. 123456">
      </div>
      <div class="field full">
        <label for="restName">Restaurant Name / Business Name</label>
        <input type="text" id="restName" placeholder="e.g. Spice Route Kitchen">
      </div>
      <div class="field">
        <label for="userType">User Type</label>
        <select id="userType">
          <option value="NPU (Non-Petpooja User)">NPU (Non-Petpooja User)</option>
          <option value="PPU (Petpooja User)">PPU (Petpooja User)</option>
        </select>
      </div>
      <div class="field">
        <label for="person">Name of Person</label>
        <input type="text" id="person" placeholder="Trainee name">
      </div>
      <div class="field full">
        <label for="contact">Contact of Trainee</label>
        <input type="tel" id="contact" placeholder="10-digit mobile number" inputmode="numeric">
      </div>
    </div>

    <div class="section-title"><span class="num">2</span>Training Specifics</div>
    <div class="grid2">
      <div class="field">
        <label for="trainingType">Training Type</label>
        <select id="trainingType">
          <option value="New">New</option>
          <option value="Retraining">Retraining</option>
          <option value="Support Issue">Support Issue</option>
          <option value="Only Installation">Only Installation</option>
          <option value="Renewal &amp; Retention Visit">Renewal &amp; Retention Visit</option>
        </select>
      </div>
      <div class="field">
        <label for="trainingMode">Training Mode</label>
        <select id="trainingMode">
          <option value="Physical">Physical</option>
          <option value="Virtual">Virtual</option>
          <option value="Out of station">Out of station</option>
        </select>
      </div>

      <div class="field">
        <label for="ticketSource">Ticket Received From</label>
        <select id="ticketSource">
          <option value="New Support Ticket">New Support Ticket</option>
          <option value="Centralized Query Ticket">Centralized Query Ticket</option>
          <option value="New Zoho Ticket">New Zoho Ticket</option>
        </select>
      </div>
      <div class="field"></div>

      <div class="field full">
        <div id="retrainWrap" class="conditional">
          <label for="retrainReason">Retraining / Support Issue Reason <span class="req">*</span></label>
          <input type="text" id="retrainReason" placeholder="Reason for retraining or support ticket">
        </div>
      </div>

      <div class="field">
        <label for="product">Product</label>
        <select id="product">
          <option value="POS">POS</option>
          <option value="Payroll">Payroll</option>
          <option value="PP Invoice">PP Invoice</option>
          <option value="Purchase">Purchase</option>
          <option value="WCD">WCD (Waiter Calling Device)</option>
          <option value="Task Management">Task Management</option>
          <option value="Reservation">Reservation</option>
          <option value="Mosambee EDC / Petpooja Pay">Mosambee EDC / Petpooja Pay</option>
          <option value="Retail POS">Retail POS</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="subProduct">Sub-product</label>
        <select id="subProduct">
          <option value="POS Basic">POS Basic</option>
          <option value="POS+Growth">POS+Growth</option>
          <option value="POS+Scale">POS+Scale</option>
          <option value="Local POS Basic">Local POS Basic</option>
          <option value="Petpooja Invoice Android (Basic)">Petpooja Invoice Android (Basic)</option>
          <option value="Petpooja Invoice Android (Advance)">Petpooja Invoice Android (Advance)</option>
          <option value="Petpooja Invoice Desktop (Basic)">Petpooja Invoice Desktop (Basic)</option>
          <option value="Petpooja Invoice Desktop (Advance)">Petpooja Invoice Desktop (Advance)</option>
          <option value="Payroll (Basic)">Payroll (Basic)</option>
          <option value="Payroll Pro">Payroll Pro</option>
          <option value="Payroll Face">Payroll Face</option>
          <option value="Payroll (E-SIM)">Payroll (E-SIM)</option>
          <option value="Remotely First">Remotely First</option>
          <option value="Onsite">Onsite</option>
          <option value="Already Installed">Already Installed</option>
          <option value="NA">NA</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field full">
        <label for="features">Product Features Covered</label>
        <textarea id="features" rows="2" placeholder="e.g. Billing, KOT, Menu management, Reports"></textarea>
      </div>
      <div class="field full">
        <label for="marketplace">Marketplace Services Covered</label>
        <textarea id="marketplace" rows="2" placeholder="As per client plan or individual services bought"></textarea>
      </div>

      <div class="field">
        <label for="start">Training Start Time</label>
        <input type="time" id="start">
      </div>
      <div class="field">
        <label for="end">Training End Time</label>
        <input type="time" id="end">
      </div>

      <div class="field">
        <label for="trainingStatus">Training Status</label>
        <select id="trainingStatus">
          <option value="Completed">Completed</option>
          <option value="Incomplete">Incomplete</option>
        </select>
      </div>
      <div class="field"></div>

      <div class="field full">
        <div id="incompleteWrap" class="conditional">
          <label for="incompleteReason">Incomplete Reason <span class="req">*</span></label>
          <textarea id="incompleteReason" rows="2" placeholder="Reason training is incomplete — mention supportive attachment (outlet photo) separately"></textarea>
        </div>
      </div>
    </div>

    <div class="section-title"><span class="num">3</span>Setup & Attendance</div>
    <div class="grid2">
      <div class="field">
        <label for="ownerDashboard">Owner Dashboard</label>
        <select id="ownerDashboard">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>
      <div class="field">
        <div id="aiAgentWrap" class="conditional">
          <label for="aiAgent">AI Agent (Petpooja) <span class="req">*</span></label>
          <select id="aiAgent">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
      </div>

      <div class="field full">
        <label>Training Attended By</label>
        <div class="checkbox-row">
          <label><input type="checkbox" class="attendee" value="Owner"> Owner</label>
          <label><input type="checkbox" class="attendee" value="Manager"> Manager</label>
          <label><input type="checkbox" class="attendee" value="Staff" id="staffCheck"> Staff</label>
        </div>
        <div id="staffNameWrap" class="conditional">
          <label for="staffName">Staff Name</label>
          <input type="text" id="staffName" placeholder="Enter staff name">
        </div>
      </div>

      <div class="field full">
        <label for="parallelSetup">Parallel Setup Done</label>
        <select id="parallelSetup">
          <option value="Yes">Yes</option>
          <option value="No">No</option>
          <option value="Already Done Remotely">Already Done Remotely</option>
        </select>
      </div>
    </div>

    <div class="section-title"><span class="num">4</span>Checklist Template</div>
    <div class="grid2">
      <div class="field full">
        <label for="template">Select Template</label>
        <select id="template">
          <option value="payroll">Payroll Template</option>
          <option value="pos">POS Template</option>
          <option value="pospayroll">POS with Payroll Template</option>
          <option value="purchase">Petpooja Purchase Template</option>
          <option value="wcd">WCD Template</option>
          <option value="task">Task Template</option>
          <option value="reservation">Reservation Template</option>
          <option value="edc">Mosambee EDC & Petpooja Pay/EDC Template</option>
          <option value="retail">Retail POS Template</option>
        </select>
      </div>
    </div>
    <div id="checklistFields"></div>

    <div class="section-title"><span class="num">5</span>Additional Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--slate);font-size:12px;">(optional)</span></div>
    <div class="grid2">
      <div class="field full">
        <label for="pendingServices">Pending Services / Product (I&T)</label>
        <textarea id="pendingServices" rows="2" placeholder="Mention any pending item with the reason"></textarea>
      </div>
      <div class="field full">
        <label for="specialNote">Special Note / Instructions</label>
        <textarea id="specialNote" rows="2" placeholder="Location exceptions, remote setup, dev requirement requested, unresolved issue, replacement, etc."></textarea>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" onclick="generateTemplate()">Generate Email</button>
      <button class="btn-secondary" onclick="resetForm()">Reset</button>
    </div>
  </div>

  <div class="card output-card">
    <div class="output-head">
      <h3>Email Output</h3>
    </div>
    <div id="output" contenteditable="true"></div>
    <button class="btn-primary" style="margin-top:14px;" onclick="copyOutput()">Copy to Clipboard</button>
    <div class="copy-confirm" id="copyConfirm">✓ Copied to clipboard!</div>
    <textarea id="hiddenTextarea" class="hidden-textarea"></textarea>
  </div>

</div>

<script>
  // ==================================================================
  // ---- Checklist data model ----
  // Each template = { header: string|null, sections: [ {heading, items:[{label, options, default, note}]} ], fixedNote: string|null }
  // ==================================================================
  const templates = {
    retail: {
      header: null,
      sections: [
        { heading:"Basic Setup:", items:[
          {label:"Login Process", options:["Yes","No"]},
          {label:"Item Addition", options:["Yes","No"]},
          {label:"Inventory Preferences", options:["Yes","No"]},
          {label:"Sales Preferences", options:["Yes","No"]},
          {label:"POS Preferences", options:["Yes","No"]},
          {label:"GST and Tax Preferences", options:["Yes","No"]}
        ]},
        { heading:"POS & Hardware Setup:", items:[
          {label:"POS Installations and Counter Set-up", options:["Yes","No"]},
          {label:"Printers and Template Set-up", options:["Yes","No"]},
          {label:"Barcode Set-up and Printing Guide", options:["Yes","No"]}
        ]},
        { heading:"Operations & Transactions:", items:[
          {label:"Stock Management", options:["Yes","No"]},
          {label:"Purchase Bill and Purchase Training (Advance Plan)", options:["Yes","No","NA"]},
          {label:"Auto-sync and Retail Invoices on the Dashboard", options:["Yes","No"]},
          {label:"Dashboard Overview", options:["Yes","No"]},
          {label:"Invoice Creation and Preferences", options:["Yes","No"]},
          {label:"Process of Adding Receipts and Payments", options:["Yes","No"]},
          {label:"POS Overview and Understanding", options:["Yes","No"]},
          {label:"Step-by-step POS Usage Guide", options:["Yes","No"]},
          {label:"AI Garments Try on", options:["Yes","No"]}
        ]},
        { heading:"Reports & Monitoring:", items:[
          {label:"Reports and Dashboard", options:["Yes","No"]}
        ]}
      ]
    },

    payroll: {
      header:"Petpooja Payroll:",
      sections:[
        { heading:"Phase 1", items:[
          {label:"Owner Dashboard & Mobile App", options:["Yes","No"], default:"Yes"},
          {label:"Biometric Device Intro & Setup", options:["Yes","No"], default:"No"},
          {label:"Device Light Indication", options:["Yes","No"], default:"No"},
          {label:"Wi-Fi Connectivity", options:["Yes","No"], default:"No"}
        ]},
        { heading:"Phase 2", items:[
          {label:"Add Employee (Web & App)", options:["Yes (Web)","Yes (App)","Yes (Both)","No"], default:"Yes (Web)"},
          {label:"Biometric Registration", options:["Yes","No"], default:"No"},
          {label:"Shift & Roster Management", options:["Yes","No"], default:"Yes"},
          {label:"Week Off & Leave Setup", options:["Yes","No"], default:"Yes"},
          {label:"User Management & Reports", options:["Yes","No"], default:"Yes"},
          {label:"Payroll Module & Salary Slip", options:["Yes","No"], default:"Yes"},
          {label:"Owner App Quick Actions", options:["Yes","No"], default:"No"}
        ]},
        { heading:"Phase 3", items:[
          {label:"Employee App Training", options:["Yes","No"], default:"No"},
          {label:"Language Setup", options:["Yes","No"], default:"No"},
          {label:"Leave Apply & Regularisation", options:["Yes","No"], default:"Yes"},
          {label:"Attendance & Salary Slip Check", options:["Yes","No"], default:"Yes"},
          {label:"Re login after Device Change", options:["Yes","No"], default:"Yes"}
        ]}
      ]
    },

    pos: {
      header:null,
      sections:[
        { heading:"POS Check List:", items:[
          {label:"POS Installation & Setup", options:["Yes","No"]},
          {label:"Printer Configuration & Cash Drawer", options:["Yes","No"]},
          {label:"Billing & Order Flow", options:["Yes","No"]},
          {label:"Operations", options:["Yes","No"]},
          {label:"Item Management (POS Menu)", options:["Yes","No"]},
          {label:"Inventory & Stock Management", options:["Yes","No"]},
          {label:"Reports", options:["Yes","No"]},
          {label:"Restaurant Configuration & Logs", options:["Yes","No"]}
        ]},
        { heading:"Dashboard Check List:", items:[
          {label:"Main Dashboard View", options:["Yes","No"]},
          {label:"Daily Operations", options:["Yes","No"]},
          {label:"Menu Management", options:["Yes","No"]},
          {label:"Reports", options:["Yes","No"]},
          {label:"CRM", options:["Yes","No"]},
          {label:"User Management", options:["Yes","No"]},
          {label:"Petpooja Agent AI", options:["Yes","No"]},
          {label:"Petpooja App & Quick Links Configurations", options:["Yes","No"]}
        ]}
      ]
    },

    pospayroll: {
      header:null,
      sections:[
        { heading:"Petpooja POSS:", items:[
          {label:"Billing & KOT management", options:["Yes","No"]},
          {label:"Printer Setup (Kitchen LAN printer)", options:["Yes","No"]},
          {label:"Reports", options:["Yes","No"]},
          {label:"Menu management", options:["Yes","No"]},
          {label:"Owner Dashboard", options:["Yes","No"]},
          {label:"Captain app ordering", options:["Yes","No"]}
        ]},
        { heading:"Petpooja Payroll:", items:[] },
        { heading:"Phase 1", items:[
          {label:"Owner Dashboard & Mobile App", options:["Yes","No"], default:"Yes"},
          {label:"Biometric Device Intro & Setup", options:["Yes","No"], default:"No"},
          {label:"Device Light Indication", options:["Yes","No"], default:"No"},
          {label:"Wi-Fi Connectivity", options:["Yes","No"], default:"No"}
        ]},
        { heading:"Phase 2", items:[
          {label:"Add Employee (Web & App)", options:["Yes (Web)","Yes (App)","Yes (Both)","No"], default:"Yes (Web)"},
          {label:"Biometric Registration", options:["Yes","No"], default:"No"},
          {label:"Shift & Roster Management", options:["Yes","No"], default:"Yes"},

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Render checklist UI for the chosen template ----
  function renderChecklist(key){
    const container = document.getElementById('checklistFields');
    const t = templates[key];
    if(!t){ container.innerHTML = ''; return; }
    let html = '';
    t.sections.forEach((sec, sIdx) => {
      if(sec.heading) html += `<div class="cl-heading">${escapeHtml(sec.heading)}</div>`;
      sec.items.forEach((item, iIdx) => {
        const uid = `cl_${key}_${sIdx}_${iIdx}`;
        const def = item.default || item.options[0];
        html += `<div class="cl-item"><span class="cl-label">${escapeHtml(item.label)}</span><span class="cl-options">`;
        item.options.forEach(opt => {
          const checked = opt === def ? 'checked' : '';
          html += `<label class="cl-opt"><input type="radio" name="${uid}" value="${escapeHtml(opt)}" ${checked}> ${escapeHtml(opt)}</label>`;
        });
        html += `</span>`;
        if(item.note){
          html += `<input type="text" class="cl-note" id="${uid}_note" placeholder="Count (optional)">`;
        }
        html += `</div>`;
      });
    });
    if(t.fixedNote){
      html += `<div class="cl-fixed-note">${escapeHtml(t.fixedNote)}</div>`;
    }
    container.innerHTML = html;
    restoreChecklistSelections();
  }

  function restoreChecklistSelections(){
    document.querySelectorAll('#checklistFields input[type="radio"]').forEach(r => {
      const saved = localStorage.getItem(r.name);
      if(saved !== null) r.checked = (r.value === saved);
    });
    document.querySelectorAll('#checklistFields input.cl-note').forEach(n => {
      const saved = localStorage.getItem(n.id);
      if(saved !== null) n.value = saved;
    });
  }

  // ---- Build the checklist text block for the generated email ----
  function getChecklistText(key){
    const t = templates[key];
    if(!t) return '';
    let lines = [];
    if(t.header) { lines.push(t.header); lines.push(''); }
    t.sections.forEach((sec, sIdx) => {
      if(sec.heading) lines.push(sec.heading);
      sec.items.forEach((item, iIdx) => {
        const uid = `cl_${key}_${sIdx}_${iIdx}`;
        const checkedInput = document.querySelector(`input[name="${uid}"]:checked`);
        const value = checkedInput ? checkedInput.value : (item.default || item.options[0]);
        let line = `${item.label} : ${value}`;
        if(item.note){
          const noteEl = document.getElementById(`${uid}_note`);
          if(noteEl && noteEl.value.trim()) line += ` (Count: ${noteEl.value.trim()})`;
        }
        lines.push(line);
      });
      lines.push('');
    });
    if(t.fixedNote){
      lines.push(t.fixedNote);
    }
    // collapse trailing blank lines, keep single blank line between sections
    return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  // ---- Conditional field logic ----
  function refreshConditionals(){
    const trainingType = document.getElementById('trainingType').value;
    document.getElementById('retrainWrap').classList.toggle('show', trainingType === 'Retraining' || trainingType === 'Support Issue');

    const trainingStatus = document.getElementById('trainingStatus').value;
    document.getElementById('incompleteWrap').classList.toggle('show', trainingStatus === 'Incomplete');

    const ownerDashboard = document.getElementById('ownerDashboard').value;
    document.getElementById('aiAgentWrap').classList.toggle('show', ownerDashboard === 'Yes');

    const staffChecked = document.getElementById('staffCheck').checked;
    document.getElementById('staffNameWrap').classList.toggle('show', staffChecked);
  }

  ['trainingType','trainingStatus','ownerDashboard'].forEach(id=>{
    document.getElementById(id).addEventListener('change', refreshConditionals);
  });
  document.getElementById('staffCheck').addEventListener('change', refreshConditionals);

  document.getElementById('template').addEventListener('change', function(){
    renderChecklist(this.value);
    autoSave();
  });

  // ---- Auto-save ----
  function autoSave() {
    document.querySelectorAll("input, select, textarea").forEach(el => {
      if (el.type === "checkbox") {
        localStorage.setItem(el.id || el.value, el.checked ? "1" : "0");
      } else if (el.type === "radio") {
        if (el.checked) localStorage.setItem(el.name, el.value);
      } else {
        if (el.id) localStorage.setItem(el.id, el.value);
      }
    });
    localStorage.setItem("outputContent", document.getElementById("output").innerText);
  }
  function restoreData() {
    document.querySelectorAll("input, select, textarea").forEach(el => {
      if (el.closest('#checklistFields')) return; // handled after render
      if (el.type === "checkbox") {
        const key = el.id || el.value;
        const saved = localStorage.getItem(key);
        if (saved !== null) el.checked = saved === "1";
      } else {
        const saved = localStorage.getItem(el.id);
        if (saved !== null && el.id) el.value = saved;
      }
    });
    const savedOutput = localStorage.getItem("outputContent");
    if (savedOutput) document.getElementById("output").innerText = savedOutput;
    if (!document.getElementById('date').value) {
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
    }
    refreshConditionals();
    renderChecklist(val('template'));
  }
  window.addEventListener("input", autoSave);
  window.addEventListener("change", autoSave);
  window.addEventListener("keyup", autoSave);
  window.addEventListener("load", restoreData);

  // ---- Helpers ----
  function formatTime(time) {
    if (!time) return "";
    let [hour, minute] = time.split(":");
    hour = parseInt(hour);
    const ampm = hour >= 12 ? "P.M" : "A.M";
    hour = hour % 12 || 12;
    return `${hour}:${minute} ${ampm}`;
  }
  function formatDate(d) {
    if (!d) return "";
    const [y, m, day] = d.split("-");
    return `${day}/${m}/${y}`;
  }
  function val(id){ return document.getElementById(id).value; }

  function buildHeader() {
    const date = formatDate(val('date'));
    const restId = val('restId');
    const restName = val('restName');
    const userType = val('userType');
    const person = val('person');
    const contact = val('contact');
    const trainingType = val('trainingType');
    const retrainReason = val('retrainReason');
    const trainingMode = val('trainingMode');
    const ticketSource = val('ticketSource');
    const product = val('product');
    const subProduct = val('subProduct');
    const features = val('features');
    const marketplace = val('marketplace');
    const start = formatTime(val('start'));
    const end = formatTime(val('end'));
    const trainingStatus = val('trainingStatus');
    const ownerDashboard = val('ownerDashboard');
    const aiAgent = val('aiAgent');

    const attendees = Array.from(document.querySelectorAll('.attendee:checked')).map(cb => {
      if (cb.value === 'Staff') {
        const name = val('staffName');
        return name ? `Staff (${name})` : 'Staff';
      }
      return cb.value;
    });
    const attendedBy = attendees.length ? attendees.join(', ') : '—';
    const parallelSetup = val('parallelSetup');

    let retrainLine = '';
    if (trainingType === 'Retraining' || trainingType === 'Support Issue') {
      retrainLine = `\nRetraining Reason: ${retrainReason}`;
    }
    let aiLine = '';
    if (ownerDashboard === 'Yes') {
      aiLine = `\nAI Agent (Petpooja): ${aiAgent}`;
    }

    return `Dear Customer,

Greetings from Petpooja!
Thank you for your time. This email confirms that the ${trainingMode} training session has been successfully conducted and the ticket is now closed.

Date: ${date}
Restaurant ID / ORG ID: ${restId}
Restaurant Name/Business Name: ${restName}
User Type: ${userType}
Name of Person: ${person}
Contact of Trainee: ${contact}
Training Type: ${trainingType}${retrainLine}
Training Mode: ${trainingMode}
Ticket Received From: ${ticketSource}
Product: ${product}
Sub-product: ${subProduct}
Product Features Covered: ${features}
Marketplace Services Covered: ${marketplace}
Training Start Time: ${start}
Training End Time: ${end}
Training Status: ${trainingStatus}
Owner Dashboard: ${ownerDashboard}${aiLine}
Training Attended By: ${attendedBy}
Parallel Setup Done: ${parallelSetup}

In this training, I have covered:
`;
  }

  function buildFooter() {
    let out = '';
    const trainingStatus = val('trainingStatus');
    const incompleteReason = val('incompleteReason');
    const pendingServices = val('pendingServices');
    const specialNote = val('specialNote');

    if (trainingStatus === 'Incomplete' && incompleteReason) {
      out += `\nIncomplete Reason: ${incompleteReason} (Supportive attachment — outlet photo — to be shared separately)\n`;
    }
    if (pendingServices) {
      out += `\nPending Services / Product (I&T): ${pendingServices}\n`;
    }
    if (specialNote) {
      out += `\nSpecial Note / Instructions: ${specialNote}\n`;
    }

    out += `
We hope the session was informative. For any questions or further assistance, reach us any time on +91 79 6922 3344 (available 24×7) or support@petpooja.com. Kindly acknowledge receipt of this email.

We also welcome your feedback — it helps us keep improving our service.
Feedback link: https://forms.gle/XXHMVTV8xxZH3AXg6`;
    return out;
  }

  function generateTemplate() {
    const template = val('template');
    const header = buildHeader();
    const checklist = getChecklistText(template);
    const footer = buildFooter();

    const content = header + checklist + '\n' + footer;
    document.getElementById('output').innerText = content;
    autoSave();
  }

  function resetForm() {
    localStorage.clear();
    document.querySelectorAll("input, select, textarea").forEach(el => {
      if (el.closest('#checklistFields')) return;
      if (el.type === "checkbox") el.checked = false;
      else el.value = "";
    });
    document.getElementById("output").innerText = "";
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    refreshConditionals();
    renderChecklist(val('template'));
  }

  function copyOutput() {
    const output = document.getElementById("output").innerText;
    const hiddenTextarea = document.getElementById("hiddenTextarea");
    hiddenTextarea.value = output;
    hiddenTextarea.select();
    hiddenTextarea.setSelectionRange(0, 99999);
    document.execCommand("copy");
    const confirmMsg = document.getElementById("copyConfirm");
    confirmMsg.style.display = "block";
    setTimeout(() => confirmMsg.style.display = "none", 2000);
  }
</script>
